openapi: 3.0.3
info:
  title: Lyrahcle API
  description: Space cybersecurity operations API for assets, orbital tracking, RF telemetry, incident response, TM/TC decoding,
    threat intelligence, and security administration.
  version: 0.12.0
  contact:
    name: Lyrahcle
  license:
    name: AGPLv3
    url: https://github.com/Lyrahcle/lyrahcle/blob/main/LICENSE
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: System
- name: Auth
- name: Users
- name: Organizations
- name: Assets
- name: Programs
- name: Satellites
- name: RF
- name: Detection
- name: Agents
- name: Legacy Agent Keys
- name: TM/TC
- name: Incidents
- name: Threat Intel
- name: Audit
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      tags:
      - System
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /readyz:
    get:
      tags:
      - System
      summary: Readiness check
      description: Verifies required runtime dependencies without exposing dependency details.
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /metrics:
    get:
      tags:
      - System
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /openapi.yaml:
    get:
      tags:
      - System
      summary: OpenAPI specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /docs:
    get:
      tags:
      - System
      summary: Swagger UI
      security: []
      responses:
        '200':
          description: Interactive API documentation
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/ping:
    get:
      tags:
      - System
      summary: Backend reachability check
      security: []
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/system-info:
    get:
      tags:
      - System
      summary: Runtime system information
      description: 'Requires role: viewer or higher.'
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate with email or username
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          description: Invalid credentials, invalid TOTP, or TOTP required
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '429':
          description: Too many login attempts
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
      description: Rate limited independently from normal API traffic. If TOTP is enabled, include totp_code.
  /api/v1/auth/sessions/:
    get:
      tags:
      - Auth
      summary: List active sessions for the current user
      description: Requires Redis-backed session tracking and role viewer or higher.
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Session management unavailable
    delete:
      tags:
      - Auth
      summary: Revoke all sessions for the current user
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Session management unavailable
  /api/v1/auth/sessions/{sessionID}:
    delete:
      tags:
      - Auth
      summary: Revoke one session owned by the current user
      parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found
        '503':
          description: Session management unavailable
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get current account
      description: 'Requires role: viewer or higher.'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out and revoke current token
      description: Requires Redis for immediate token revocation. The request still succeeds if Redis is unavailable.
      responses:
        '204':
          description: Logged out
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/change-password:
    post:
      tags:
      - Auth
      summary: Change your own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/totp/setup:
    post:
      tags:
      - Auth
      summary: Create a pending Google Authenticator TOTP secret
      responses:
        '200':
          description: TOTP setup data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '409':
          description: TOTP already enabled
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/auth/totp/enable:
    post:
      tags:
      - Auth
      summary: Enable Google Authenticator TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
      responses:
        '204':
          description: TOTP enabled
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/totp/disable:
    post:
      tags:
      - Auth
      summary: Disable Google Authenticator TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPDisableRequest'
      responses:
        '204':
          description: TOTP disabled
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/webauthn/login/start:
    post:
      tags: [Auth]
      summary: Start password plus WebAuthn security-key login
      security: []
      responses:
        '200': {description: WebAuthn assertion options}
        '401': {description: Invalid credentials}
        '409': {description: Security key not configured}
        '429': {description: Too many authentication attempts}
  /api/v1/auth/webauthn/login/finish:
    post:
      tags: [Auth]
      summary: Finish WebAuthn security-key login
      security: []
      responses:
        '200': {description: Authenticated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid or expired security-key ceremony}
  /api/v1/auth/webauthn/credentials/:
    get:
      tags: [Auth]
      summary: List security keys owned by the current user
      responses:
        '200': {description: Security-key metadata}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/webauthn/credentials/register/start:
    post:
      tags: [Auth]
      summary: Start security-key enrollment
      description: Requires the current password and a viewer-or-higher bearer session. Only cross-platform authenticators with user verification are accepted.
      responses:
        '200': {description: WebAuthn creation options}
        '401': {description: Current password verification failed}
  /api/v1/auth/webauthn/credentials/register/finish:
    post:
      tags: [Auth]
      summary: Finish security-key enrollment
      description: Consumes a short-lived one-time ceremony and invalidates existing user sessions after enrollment.
      responses:
        '204': {description: Security key enrolled}
        '401': {description: Invalid or expired ceremony}
        '409': {description: Credential already registered}
  /api/v1/auth/webauthn/credentials/{credentialID}:
    delete:
      tags: [Auth]
      summary: Remove one security key owned by the current user
      description: Requires the current password and invalidates existing sessions after removal.
      parameters:
      - name: credentialID
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204': {description: Security key removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Current password verification failed}
        '404': {description: Security key not found}
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: Feature-flagged. Always returns an accepted response to reduce account enumeration. Tokens are random, hashed at rest, single-use, and expire after 15 minutes.
      security: []
      responses:
        '202': {description: Request accepted}
        '429': {description: Too many recovery attempts}
  /api/v1/auth/password-reset/complete:
    post:
      tags: [Auth]
      summary: Complete password recovery
      description: Requires Google Authenticator when TOTP is enabled. Accounts protected by a WebAuthn security key require administrator-assisted recovery instead of bypassing the key.
      security: []
      responses:
        '204': {description: Password reset completed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid token or second-factor verification}
        '409': {description: Administrator-assisted recovery required}
  /api/v1/search:
    get:
      tags: [System]
      summary: Search satellites, assets, CVEs, and incidents
      description: Requires role viewer or higher. Query length is limited and SQL is parameterized.
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 2, maxLength: 96}
      responses:
        '200': {description: Search results}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users/:
    get:
      tags:
      - Users
      summary: List active and disabled non-deleted users
      description: 'Requires role: admin.'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      summary: Create a user
      description: 'Requires role: admin. Public self-registration is disabled.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already registered
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/users/{userID}/role:
    patch:
      tags:
      - Users
      summary: Change a user's role
      description: 'Requires role: admin. Blocks demoting the last remaining active admin.

        '
      parameters:
      - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '409':
          description: Would demote the last remaining admin
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/organizations/:
    get:
      tags:
      - Organizations
      summary: List organizations in the global control plane
      description: Requires the platform-administrator boundary; tenant-local RBAC capabilities do not grant access.
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Organizations
      summary: Create an organization
      description: Requires the platform-administrator boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMutation'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Organization slug already exists
  /api/v1/organizations/{organizationID}:
    put:
      tags:
      - Organizations
      summary: Update organization metadata
      description: Requires the platform-administrator boundary. The enabled lifecycle state is intentionally not changed by this endpoint.
      parameters:
      - name: organizationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMutation'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found
        '409':
          description: Organization slug already exists
  /api/v1/organizations/platform-users:
    get:
      tags:
      - Organizations
      summary: List users eligible for platform-administrator management
      description: Requires the platform-administrator boundary.
      responses:
        '200':
          description: Platform user inventory
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organizations/platform-admins/{userID}:
    post:
      tags:
      - Organizations
      summary: Grant platform-administrator access
      parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Access granted
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Self-grant or lifecycle conflict
    delete:
      tags:
      - Organizations
      summary: Revoke platform-administrator access
      parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Access revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Self-revocation or last-platform-admin conflict
  /api/v1/programs/:
    get:
      tags:
      - Programs
      summary: List programs
      description: 'Requires capability: programs.read.'
      responses:
        '200':
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
    post:
      tags:
      - Programs
      summary: Create a program
      description: 'Requires capability: programs.manage.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: Constellation Alpha
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/programs/{programID}:
    put:
      tags:
      - Programs
      summary: Rename a tenant program
      description: 'Requires capability: programs.manage. Returns 404 for unknown or cross-tenant IDs.'
      parameters:
      - name: programID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Program not found
    delete:
      tags:
      - Programs
      summary: Delete a tenant program
      description: 'Requires capability: programs.manage. Deletion follows database cascade rules for dependent assets/scans.'
      parameters:
      - name: programID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Program deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Program not found
  /api/v1/assets/:
    get:
      tags:
      - Assets
      summary: List tracked assets
      description: 'Requires capability: assets.read.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
    post:
      tags:
      - Assets
      summary: Create or update an asset
      description: 'Requires capability: assets.manage.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Asset created
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/assets/{assetID}:
    put:
      tags:
      - Assets
      summary: Update a tenant asset
      description: 'Requires capability: assets.manage. The target program must belong to the same tenant.'
      parameters:
      - name: assetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Asset or tenant-local target program not found
    delete:
      tags:
      - Assets
      summary: Delete a tenant asset
      description: 'Requires capability: assets.manage.'
      parameters:
      - name: assetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Asset deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Asset not found
  /api/v1/satellites/:
    get:
      tags:
      - Satellites
      summary: List tracked satellites with live computed position
      description: 'Requires capability: orbital.read.'
      responses:
        '200':
          description: List of satellites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SatelliteWithPosition'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
    post:
      tags:
      - Satellites
      summary: Register a satellite by NORAD ID and TLE
      description: 'Requires capability: orbital.manage.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSatelliteRequest'
      responses:
        '201':
          description: Satellite registered
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/satellites/{satelliteID}:
    put:
      tags:
      - Satellites
      summary: Update a tracked satellite and its TLE
      description: 'Requires capability: orbital.manage. Satellites are part of the shared global orbital reference catalog.'
      parameters:
      - name: satelliteID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSatelliteRequest'
      responses:
        '200':
          description: Satellite updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatelliteRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Satellite not found
        '409':
          description: NORAD ID already registered by another satellite
  /api/v1/satellites/{satelliteID}/external-sources:
    get:
      tags:
      - Satellites
      summary: Get live public SatNOGS context by NORAD identifier
      description: Returns cached SatNOGS DB metadata/transmitters and recent SatNOGS Network observations. Community reception is external context and is not proof of spacecraft health, control, or vulnerability exposure. Requires orbital.read.
      parameters:
      - name: satelliteID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Normalized external satellite intelligence with per-source freshness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatelliteSourceIntelligence'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/satellites/{satelliteID}/passes:
    get:
      tags:
      - Satellites
      summary: Predict satellite passes for a ground station
      description: 'Requires capability: orbital.read. Predicts AOS, LOS, peak time, maximum elevation, and duration using the stored TLE. Stale or unusable TLEs are rejected. Aging TLEs are returned with degraded orbital confidence.'
      parameters:
      - name: satelliteID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: latitude_deg
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitude_deg
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: altitude_m
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 0
          minimum: -500
          maximum: 10000
      - name: from
        in: query
        required: false
        description: Prediction start in RFC3339. Defaults to current UTC time.
        schema:
          type: string
          format: date-time
      - name: hours
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 24
          exclusiveMinimum: true
          minimum: 0
          maximum: 72
      - name: min_elevation_deg
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 0
          minimum: 0
          maximum: 90
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Predicted passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatellitePassPredictionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Satellite not found
        '422':
          description: TLE is stale/unusable or propagation failed
  /api/v1/satellites/{satelliteID}/orbital-events:
    get:
      tags:
      - Satellites
      summary: List maneuver and conjunction context for a satellite
      description: 'Requires capability: orbital.read. Returns persisted operator/trusted-integration orbital operations context. Events are candidate-only evidence and do not directly change incident severity.'
      parameters:
      - name: satelliteID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hours
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 168
          exclusiveMinimum: true
          minimum: 0
          maximum: 2160
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Orbital operations context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrbitalEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Satellite not found
    post:
      tags:
      - Satellites
      summary: Ingest maneuver or conjunction context
      description: 'Requires capability: orbital.manage. Stores trusted/operator-provided orbital context for correlation. This endpoint does not claim automatic maneuver detection or conjunction screening.'
      parameters:
      - name: satelliteID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrbitalEventRequest'
      responses:
        '201':
          description: Orbital event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbitalEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Satellite not found
  /api/v1/satellites/stream:
    get:
      tags:
      - Satellites
      summary: Stream live satellite positions
      description: 'Requires capability: orbital.read. Server-Sent Events; sends an initial satellites event and refreshes every
        five seconds.'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/{userID}/status:
    patch:
      tags:
      - Users
      summary: Enable or disable a user account
      description: 'Requires role: admin. Disabling revokes authorization state. The current user and last active admin cannot be disabled.'
      parameters:
      - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
        '409':
          description: Self-lockout or last-admin protection
  /api/v1/users/{userID}:
    delete:
      tags:
      - Users
      summary: Soft-delete a user account
      description: 'Requires role: admin. Removes login identifiers and TOTP material while preserving audit-linked identity. The current user and last active admin cannot be deleted.'
      parameters:
      - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
        '409':
          description: Self-lockout or last-admin protection
  /api/v1/agent-keys/:
    get:
      tags:
      - Legacy Agent Keys
      summary: List legacy issued agent keys
      description: 'Requires role: admin.'
      responses:
        '200':
          description: List of agent key summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentKeySummary'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
    post:
      tags:
      - Legacy Agent Keys
      summary: Create a legacy API key scoped to one agent_id
      description: 'Requires role: admin. The plaintext key is returned once, at creation time — only its SHA-256 hash is
        stored.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agent_id
              properties:
                agent_id:
                  type: string
                  example: sdr-agent-madrid
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyCreated'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: agent_id already has an active key
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/agent-keys/{agentID}:
    delete:
      tags:
      - Legacy Agent Keys
      summary: Revoke that agent's key
      description: 'Requires agents.read or agents.manage.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Key revoked
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '404':
          description: No active key for that agent_id
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/agents/me/device:
    post:
      tags:
      - Legacy Agent Keys
      summary: Report authenticated agent device metadata
      description: Long-running agents should authenticate with an active mTLS client certificate. Legacy X-Agent-Key remains accepted for migration. Agent identity is derived from the authenticated machine credential and cannot be selected by the request body. OpenAPI 3.0 does not model the TLS client-certificate check as a security scheme.
      security:
      - agentKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeviceInfo'
      responses:
        '204':
          description: Device metadata stored
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/rf/ingest:
    post:
      tags:
      - RF
      summary: Ingest an RF reading
      description: 'Used by sdr-agent. Active mTLS client certificates are the preferred unattended-agent credential. Legacy `X-Agent-Key` credentials remain accepted for migration, and operator-or-higher bearer tokens are supported for human operational ingestion. Each reading is checked against that agent''s recent baseline and flagged as an anomaly on statistical outliers. OpenAPI 3.0 does not model the TLS client-certificate check as a security scheme.'
      security:
      - bearerAuth: []
      - agentKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RFReadingInput'
      responses:
        '201':
          description: Reading ingested
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: agent_id does not match the authenticated agent key
          content:
            text/plain: {}
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/rf/readings:
    get:
      tags:
      - RF
      summary: List recent RF readings
      description: 'Requires role: viewer or higher. Returns up to 100 most recent.'
      responses:
        '200':
          description: List of RF readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RFReading'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/rf/doppler:
    get:
      tags:
      - RF
      summary: Compare expected and observed Doppler for recent frequency anomalies
      description: 'Requires rf.read. Returns only anomalies with a linked satellite, configured ground station and usable TLE. Expected frequency is the anomaly baseline plus orbital Doppler.'
      responses:
        '200':
          description: Doppler comparisons derived from recent RF frequency anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RFDopplerComparison'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/rf/anomalies:
    get:
      tags:
      - RF
      summary: List recent RF anomalies
      description: 'Requires role: viewer or higher. Returns recent anomalies produced by robust spot and trend baselines.'
      responses:
        '200':
          description: List of RF anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RFAnomaly'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
