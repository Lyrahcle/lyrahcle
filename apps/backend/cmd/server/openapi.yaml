      summary: Mark an alert as reviewed
      description: 'Requires role: operator or higher. Idempotent — acknowledging an already-acknowledged alert succeeds and
        just overwrites who/when.

        '
      parameters:
      - name: alertID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Acknowledged
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No alert with that ID
