          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin role required
        '409':
          description: Rule name conflict
  /api/v1/detection-rules/{ruleID}:
    patch:
      tags:
      - Detection
      summary: Update an RF detection rule
      description: 'Requires role: admin. Rules are disabled rather than deleted to preserve detection history.'
      parameters:
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionRuleUpdateRequest'
      responses:
        '200':
          description: Detection rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin role required
        '404':
          description: Detection rule not found
  /api/v1/agents/:
    get:
      tags:
      - Agents
      summary: List mTLS agent identities
      description: 'Requires agents.read or agents.manage. Tenant-scoped lifecycle state, versions, station metadata, and SDR hardware capability reports.'
      responses:
        '200':
          description: Agent identities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [agent_id, status]
                  properties:
                    agent_id:
                      type: string
                    status:
                      type: string
                      enum: [pending, active, quarantined, revoked, offline]
                    first_seen_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_seen_at:
                      type: string
                      format: date-time
                      nullable: true
                    agent_version:
                      type: string
                    firmware_version:
                      type: string
                    device:
                      $ref: '#/components/schemas/AgentDeviceInfo'
                    certificate:
                      type: object
                      nullable: true
                      properties:
                        fingerprint_sha256:
                          type: string
                        serial_number:
                          type: string
                        not_before:
                          type: string
                          format: date-time
                        not_after:
                          type: string
                          format: date-time
                        status:
                          type: string
  /api/v1/agents/enrollment-tokens:
    post:
      tags:
      - Agents
      summary: Issue a one-time SDR agent enrollment token
      description: 'Requires role: admin. The plaintext token is returned once and only its SHA-256 hash is stored.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        '201':
          description: Enrollment token created
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, token, expires_at]
                properties:
                  agent_id:
                    type: string
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '409':
          description: Agent is already enrolled or inactive
  /api/v1/agents/enroll:
    post:
      tags:
      - Agents
      summary: Enroll an SDR agent certificate
      description: Exchanges a one-time enrollment token and agent-generated CSR for a short-lived client certificate. TLS is mandatory in production.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, csr_pem]
              properties:
                token:
                  type: string
                csr_pem:
                  type: string
                agent_version:
                  type: string
                firmware_version:
                  type: string
      responses:
        '200':
          description: Client certificate issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  certificate_pem:
                    type: string
                  ca_pem:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Invalid or expired enrollment token
  /api/v1/agents/me/certificate/rotate:
    post:
      tags:
      - Agents
      summary: Rotate the authenticated SDR agent client certificate
      description: Requires a currently valid mTLS client certificate. The agent generates a new private key and submits only the CSR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              properties:
                csr_pem:
                  type: string
      responses:
        '200':
          description: Replacement client certificate
        '401':
          description: Client certificate required or inactive
  /api/v1/agents/{agentID}/status:
    patch:
      tags:
      - Agents
      summary: Quarantine, reactivate, or permanently revoke an SDR agent
      description: 'Requires role: admin. Revocation is irreversible and revokes the active certificate.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, quarantined, revoked]
      responses:
        '204':
          description: Agent status updated
        '404':
          description: Agent not found
  /api/v1/agents/{agentID}/station:
    put:
      tags: [Agents]
      summary: Set trusted ground-station coordinates for an SDR agent
      description: 'Requires role: admin. Coordinates are used for orbital visibility and Doppler correlation.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude_deg, longitude_deg, altitude_m]
              properties:
                latitude_deg: {type: number, minimum: -90, maximum: 90}
                longitude_deg: {type: number, minimum: -180, maximum: 180}
                altitude_m: {type: number, minimum: -500, maximum: 10000}
      responses:
        '204': {description: Ground-station coordinates updated}
        '404': {description: Agent not found}
  /api/v1/agents/{agentID}/config:
    get:
      tags: [Agents]
      summary: Read desired signed configuration for an SDR agent
      description: 'Requires role: admin.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: Desired configuration and acknowledgement state}
        '204': {description: No desired configuration}
    put:
      tags: [Agents]
      summary: Publish a new signed SDR agent configuration
      description: 'Requires agents.manage. Creates an immutable monotonic version bound to the signing KID used for that version. Only active mTLS agents are configurable.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency_hz, capture_interval_seconds]
              properties:
                frequency_hz:
                  type: integer
                  format: int64
                  minimum: 100000
                  maximum: 6000000000
                capture_interval_seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                satellite_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional tracked satellite propagated in the signed configuration and attached to RF readings.
      responses:
        '201': {description: Signed configuration version created}
        '409': {description: Agent is not active}
  /api/v1/agents/{agentID}/config/history:
    get:
      tags: [Agents]
      summary: List immutable SDR agent configuration history
      description: 'Requires agents.read or agents.manage. Returns up to the latest 20 versions, signing KIDs, and acknowledgements.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: Configuration history}
  /api/v1/agents/{agentID}/config/rollback:
    post:
      tags: [Agents]
      summary: Roll back SDR agent settings by creating a new signed version
      description: 'Requires agents.manage. Historical rows remain immutable; rollback creates a newly signed version with the currently active signing KID.'
      parameters:
      - name: agentID
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, format: int64, minimum: 1}
      responses:
        '201': {description: Rollback version created}
        '404': {description: Historical version not found}
  /api/v1/agents/me/config:
    get:
      tags: [Agents]
      summary: Poll the desired signed configuration
      description: Requires a valid active SDR mTLS client certificate. Legacy API keys and human JWTs are not accepted.
      security: []
      parameters:
      - name: after_version
        in: query
        schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Signed configuration envelope
          content:
            application/json:
              schema:
                type: object
                required: [payload, signature, checksum_sha256]
                properties:
                  kid:
                    type: string
                    maxLength: 128
                    description: Stable signing-key identifier. Omitted only for legacy pre-KID configuration versions.
                  payload: {type: string}
                  signature: {type: string}
                  checksum_sha256: {type: string}
        '204': {description: No newer desired version}
        '401': {description: Active mTLS identity required}
  /api/v1/agents/me/config/ack:
    post:
      tags: [Agents]
      summary: Acknowledge application or rejection of a signed configuration
      description: Requires a valid active SDR mTLS client certificate. Acknowledgements are idempotent for the same status/message/checksum.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, status, checksum_sha256]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                status: {type: string, enum: [applied, rejected]}
                message: {type: string, maxLength: 256}
                checksum_sha256: {type: string, minLength: 64, maxLength: 64}
      responses:
        '204': {description: Acknowledgement recorded}
        '409': {description: Acknowledgement conflicts with immutable history}
        '401': {description: Active mTLS identity required}
  /api/v1/platform/rate-limits:
    get:
      summary: Read effective tenant-aware rate-limit policy
      description: Platform-administrator-only visibility into human, tenant, agent, and platform emergency rate-limit budgets. Values are configured operationally through RATE_LIMIT_* environment variables.
      responses:
        '200':
          description: Effective rate-limit policy and Redis distribution state
        '403':
          description: Platform administrator required
  /api/v1/signing-keys/agent-config/:
    get:
      summary: List remote-config signing keys
      description: Platform-administrator-only view of the agent configuration signing-key lifecycle. Private key material is never returned.
      responses:
        '200':
          description: Signing key lifecycle state
        '403':
          description: Platform administrator required
  /api/v1/signing-keys/agent-config/policy:
    put:
      summary: Update remote-config signing key rotation policy
      description: Platform-administrator-only update of prepare-only rotation scheduling and lifecycle warning windows. Automatic activation is never performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [automatic_prepare, interval_seconds, staged_alert_after_seconds, grace_alert_before_seconds]
              properties:
                automatic_prepare: {type: boolean}
                interval_seconds: {type: integer, minimum: 86400, maximum: 31536000}
                staged_alert_after_seconds: {type: integer, minimum: 3600, maximum: 2592000}
                grace_alert_before_seconds: {type: integer, minimum: 3600, maximum: 2592000}
      responses:
        '200':
          description: Updated persisted rotation policy
        '400':
          description: Invalid policy
        '403':
          description: Platform administrator required
        '409':
          description: Managed lifecycle is unavailable
  /api/v1/signing-keys/agent-config/prepare:
    post:
      summary: Prepare remote-config signing key rotation
      description: Generates a staged Ed25519 key and returns only its public key for distribution to SDR agents.
      responses:
        '201':
          description: Staged key plus public verification key
        '409':
          description: A staged key already exists or lifecycle management is unavailable
  /api/v1/signing-keys/agent-config/{kid}/public-key:
    get:
      summary: Export a signing public key
      parameters:
        - in: path
          name: kid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public verification key PEM
        '404':
          description: Signing key not found
  /api/v1/signing-keys/agent-config/{kid}/activate:
    post:
      summary: Activate a staged signing key
      description: Makes the staged key active and moves the previous active key into the configured grace period.
      parameters:
        - in: path
          name: kid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  minimum: 3600
                  maximum: 2592000
      responses:
        '200':
          description: Activated signing key metadata
        '409':
          description: Signing key is not staged
  /api/v1/signing-keys/agent-config/{kid}/revoke:
    post:
      summary: Revoke a staged or grace signing key
      description: Immediately removes the key from backend trust. The currently active key cannot be revoked until a replacement is activated.
      parameters:
        - in: path
          name: kid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked signing key metadata
        '409':
          description: Active key cannot be revoked or lifecycle management is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human session token from /api/v1/auth/login.
    agentKeyAuth:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: Legacy per-agent migration credential issued via POST /api/v1/agent-keys. Long-running agents should use mTLS enrollment.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        text/plain: {}
    Unauthorized:
      description: Missing or invalid credentials
      content:
        text/plain: {}
    Forbidden:
      description: Authenticated, but role does not permit this action
      content:
        text/plain: {}
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
    PingResponse:
      type: object
      properties:
        message:
          type: string
          example: pong from lyrahcle
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          description: Email or username
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: Required when TOTP is enabled
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum:
          - viewer
          - auditor
          - analyst
          - operator
          - admin
        must_change_password:
          type: boolean
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    UpdateRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - viewer
          - auditor
          - analyst
          - operator
          - admin
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - viewer
          - auditor
          - analyst
          - operator
          - admin
        totp_enabled:
          type: boolean
        enabled:
          type: boolean
        must_change_password:
          type: boolean
    Organization:
      type: object
      required: [id, slug, name, enabled]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name:
          type: string
          maxLength: 120
        enabled:
          type: boolean
    OrganizationMutation:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name:
          type: string
          maxLength: 120
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        kind:
          type: string
          example: domain
        value:
          type: string
          example: ground-station.example.com
        cpe_uri:
          type: string
          description: Optional CPE 2.3 identifier used for CVE applicability matching.
          example: cpe:2.3:a:acme:orbital_agent:2.4.1:*:*:*:*:*:*:*
    CreateAssetRequest:
      type: object
      required:
      - program_id
      - kind
      - value
      properties:
        program_id:
          type: string
          format: uuid
        kind:
          type: string
          example: domain
        value:
          type: string
        cpe_uri:
          type: string
          description: Optional CPE 2.3 identifier used for CVE applicability matching.
    AssetPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Asset'
    Page:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    SatellitePosition:
      type: object
      properties:
        latitude_deg:
          type: number
          format: double
        longitude_deg:
          type: number
          format: double
        altitude_km:
          type: number
          format: double
    SatelliteRecord:
      type: object
      required: [id, norad_id, name, tle_line1, tle_line2, updated_at]
      properties:
        id:
          type: string
          format: uuid
        norad_id:
          type: integer
          example: 25544
        name:
          type: string
          example: ISS (ZARYA)
        tle_line1:
          type: string
        tle_line2:
          type: string
        tle_epoch:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
    SatelliteWithPosition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        norad_id:
          type: integer
          example: 25544
        name:
          type: string
          example: ISS (ZARYA)
        tle_line1:
          type: string
        tle_line2:
          type: string
        tle_epoch:
          type: string
          format: date-time
          nullable: true
          description: Epoch encoded in TLE line 1.
        updated_at:
          type: string
          format: date-time
        tle_status:
          type: string
          enum: [fresh, aging, stale, unusable]
        tle_age_seconds:
          type: integer
          format: int64
        orbital_confidence:
          type: string
          enum: [high, degraded, unavailable]
        position_evidence_kind:
          type: string
          enum: [inferred]
          description: The position is propagated from the TLE; it is not a direct onboard measurement.
        tle_source:
          type: string
          enum: [celestrak_or_operator]
          description: Current schema cannot distinguish an automatic Celestrak TLE from an operator-provided TLE.
        position:
          allOf:
          - $ref: '#/components/schemas/SatellitePosition'
          nullable: true
          description: Omitted if propagation fails or TLE quality is stale or unusable.
    SatelliteSourceIntelligence:
      type: object
      required: [norad_id, evidence_kind, applicability, transmitters, observations, overall_quality, sources]
      properties:
        norad_id: {type: integer}
        evidence_kind: {type: string, enum: [external_community]}
        applicability: {type: string, enum: [radio_activity_context_only]}
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        transmitters:
          type: array
          items:
            type: object
            additionalProperties: true
        observations:
          type: array
          items:
            type: object
            additionalProperties: true
        last_reception: {type: string, format: date-time, nullable: true}
        overall_quality: {type: string, enum: [good, degraded, stale, unavailable]}
        sources:
          type: array
          items:
            type: object
            required: [name, url, available, fetched_at, record_count, freshness]
            properties:
              name: {type: string}
              url: {type: string, format: uri}
              available: {type: boolean}
              fetched_at: {type: string, format: date-time}
              record_count: {type: integer}
              freshness: {type: string}
              message: {type: string}
    GroundStation:
      type: object
      required: [latitude_deg, longitude_deg, altitude_m]
      properties:
        latitude_deg:
          type: number
          format: double
        longitude_deg:
          type: number
          format: double
        altitude_m:
          type: number
          format: double
    SatellitePass:
      type: object
      required: [aos, los, peak_at, max_elevation_deg, duration_seconds]
      properties:
        aos:
          type: string
          format: date-time
        los:
          type: string
          format: date-time
        peak_at:
          type: string
          format: date-time
        max_elevation_deg:
          type: number
          format: double
        duration_seconds:
          type: integer
          format: int64
        aos_truncated:
          type: boolean
          description: True when the satellite was already above the requested minimum elevation at the start of the prediction window.
        los_truncated:
          type: boolean
          description: True when the pass remains above the requested minimum elevation at the end of the prediction window.
    SatellitePassPredictionResponse:
      type: object
      required: [satellite_id, norad_id, satellite_name, tle_status, tle_age_seconds, orbital_confidence, station, from, until, min_elevation_deg, passes]
      properties:
        satellite_id:
          type: string
          format: uuid
        norad_id:
          type: integer
        satellite_name:
          type: string
        tle_status:
          type: string
          enum: [fresh, aging]
        tle_age_seconds:
          type: integer
          format: int64
        orbital_confidence:
          type: string
          enum: [high, degraded]
        station:
          $ref: '#/components/schemas/GroundStation'
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        min_elevation_deg:
          type: number
          format: double
        passes:
          type: array
          items:
            $ref: '#/components/schemas/SatellitePass'
    OrbitalEvent:
      type: object
      required: [id, satellite_id, event_type, event_time, source, confidence, severity, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        satellite_id: {type: string, format: uuid}
        event_type:
          type: string
          enum: [maneuver, conjunction]
        event_time: {type: string, format: date-time}
        source: {type: string}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        metadata:
          type: object
          additionalProperties: true
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    CreateOrbitalEventRequest:
      type: object
      required: [event_type, event_time, source, confidence, severity]
      properties:
        event_type:
          type: string
          enum: [maneuver, conjunction]
        event_time: {type: string, format: date-time}
        source:
          type: string
          minLength: 1
          maxLength: 160
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        metadata:
          type: object
          additionalProperties: true
    RegisterSatelliteRequest:
      type: object
      required:
      - norad_id
      - name
      - tle_line1
      - tle_line2
      properties:
        norad_id:
          type: integer
        name:
          type: string
        tle_line1:
          type: string
        tle_line2:
