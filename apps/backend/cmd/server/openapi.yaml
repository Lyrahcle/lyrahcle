      description: 'Requires role: viewer or higher.'
      responses:
        '200':
          description: Keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/asset-alerts/:
    get:
      tags:
      - Threat Intel
      summary: List CVE-to-asset alerts
      description: 'Requires role: viewer or higher. Raised automatically by a background worker when a synced CVE''s search
        keyword is relevant to a tracked asset''s kind (e.g. a "satellite"-keyword CVE against every satellite asset). Sorted
        unacknowledged-first, then most recent.

        '
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCVEAlertPage'
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
  /api/v1/asset-alerts/{alertID}/acknowledge:
    post:
      tags:
