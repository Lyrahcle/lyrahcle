global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lyrahcle'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cve-sync'
    static_configs:
      - targets: ['cve-sync:9091']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
