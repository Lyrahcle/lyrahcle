groups:
  - name: lyrahcle
    rules:
      - alert: LyrahcleHighServerErrorRate
        expr: sum(rate(lyrahcle_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle backend is returning elevated 5xx responses
      - alert: LyrahcleHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(lyrahcle_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle backend p95 latency is above one second
      - alert: LyrahcleHighDatabaseP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(lyrahcle_db_query_duration_seconds_bucket[5m]))) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle PostgreSQL query p95 latency is above 250 ms
      - alert: LyrahcleLowResponseCacheHitRatio
        expr: sum(rate(lyrahcle_response_cache_requests_total{result="hit"}[10m])) / clamp_min(sum(rate(lyrahcle_response_cache_requests_total{result=~"hit|miss"}[10m])), 0.001) < 0.70
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Lyrahcle response-cache hit ratio is below 70 percent
      - alert: LyrahcleAuthenticationFailures
        expr: sum(rate(lyrahcle_auth_logins_total{result!="success"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle is seeing elevated authentication failures
      - alert: LyrahcleExcessiveSSEConnections
        expr: sum(lyrahcle_sse_connections) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle has an unusually high number of open SSE connections
      - alert: LyrahcleTLECorrelationDegraded
        expr: min(lyrahcle_tle_correlation_eligible) < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more satellite TLEs exceed the orbital-correlation freshness threshold
      - alert: LyrahcleStaleTLEData
        expr: max(lyrahcle_tle_stale) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more satellite TLEs are stale or unusable
      - alert: LyrahcleCelestrakSyncFailures
        expr: sum(increase(lyrahcle_celestrak_sync_failures_total[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle has recent CelesTrak synchronization failures
      - alert: LyrahcleOrbitalCorrelationSuppressed
        expr: sum(increase(lyrahcle_orbital_correlation_suppressed_total{reason=~"tle_.*"}[30m])) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Orbital correlation is being suppressed by TLE data quality
      - alert: LyrahcleSigningKeyNoActiveKey
        expr: lyrahcle_signing_key_warnings{domain="agent_config",code="no_active_key"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Lyrahcle has no active remote-config signing key
      - alert: LyrahcleSigningKeyRotationDue
        expr: lyrahcle_signing_key_rotation_due{domain="agent_config"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle remote-config signing key rotation is due
      - alert: LyrahcleSigningKeyStagedPending
        expr: lyrahcle_signing_key_warnings{domain="agent_config",code="staged_pending"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A staged Lyrahcle signing key is awaiting distribution and activation
      - alert: LyrahcleSigningKeyGraceExpiring
        expr: lyrahcle_signing_key_warnings{domain="agent_config",code="grace_expiring"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Lyrahcle signing key grace period is approaching expiry
      - alert: LyrahcleSigningKeyAutomationFailure
        expr: sum(increase(lyrahcle_signing_key_automation_total{domain="agent_config",result=~"policy_error|list_error|prepare_error"}[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle signing-key automation encountered an error
      - alert: LyrahcleBackgroundJobFailures
        expr: sum(increase(lyrahcle_background_job_events_total{result=~"failed|ack_failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle background jobs are failing or cannot acknowledge completed work
      - alert: LyrahcleBackgroundJobCrashRecovery
        expr: sum(increase(lyrahcle_background_job_events_total{result="reclaimed"}[30m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle is repeatedly reclaiming background work from expired consumers
      - alert: LyrahcleScheduledJobLockErrors
        expr: sum(increase(lyrahcle_scheduled_job_leadership_total{result=~"error|release_error"}[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Lyrahcle scheduled-job distributed locking is failing
