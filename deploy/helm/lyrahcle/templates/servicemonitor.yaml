{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lyrahcle.fullname" . }}-backend
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lyrahcle.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: {{ ternary "https" "http" .Values.backend.tls.enabled }}
      path: /metrics
      scheme: {{ ternary "https" "http" .Values.backend.tls.enabled }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      {{- if .Values.backend.tls.enabled }}
      tlsConfig:
        {{- with .Values.monitoring.serviceMonitor.backend.tls.caSecretName }}
        ca:
          secret:
            name: {{ . }}
            key: {{ $.Values.monitoring.serviceMonitor.backend.tls.caSecretKey }}
        {{- end }}
        {{- with .Values.monitoring.serviceMonitor.backend.tls.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
        insecureSkipVerify: {{ .Values.monitoring.serviceMonitor.backend.tls.insecureSkipVerify }}
      {{- end }}
{{- if and .Values.cveSync.enabled .Values.cveSync.service.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lyrahcle.fullname" . }}-cve-sync
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: cve-sync
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lyrahcle.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cve-sync
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: {{ .Values.monitoring.serviceMonitor.cveSync.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.cveSync.scrapeTimeout }}
{{- end }}
{{- end }}
