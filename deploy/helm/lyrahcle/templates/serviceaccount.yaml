{{- if .Values.serviceAccounts.backend.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lyrahcle.backendServiceAccountName" . }}
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccounts.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.serviceAccounts.frontend.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lyrahcle.frontendServiceAccountName" . }}
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.serviceAccounts.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.cveSync.enabled .Values.serviceAccounts.cveSync.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lyrahcle.cveSyncServiceAccountName" . }}
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: cve-sync
  {{- with .Values.serviceAccounts.cveSync.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
