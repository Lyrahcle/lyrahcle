{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lyrahcle.fullname" . }}-default-deny
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lyrahcle.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lyrahcle.fullname" . }}-backend
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lyrahcle.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lyrahcle.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- if .Values.networkPolicy.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoring.namespaceLabels | nindent 14 }}
          {{- with .Values.networkPolicy.monitoring.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- end }}
    {{- if .Values.agentService.enabled }}
    - from:
        {{- range .Values.networkPolicy.agentIngressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.localDatastores.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- range .Values.networkPolicy.externalDatastoreCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.networkPolicy.httpsEgress.enabled }}
    {{- range .Values.networkPolicy.httpsEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.backendExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lyrahcle.fullname" . }}-frontend
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lyrahcle.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  {{- if or .Values.networkPolicy.ingressController.enabled .Values.networkPolicy.frontendIngressCidrs }}
  ingress:
    {{- if .Values.networkPolicy.ingressController.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceLabels | nindent 14 }}
          {{- with .Values.networkPolicy.ingressController.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- range .Values.networkPolicy.frontendIngressCidrs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "lyrahcle.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- with .Values.networkPolicy.frontendExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.cveSync.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lyrahcle.fullname" . }}-cve-sync
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lyrahcle.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cve-sync
  policyTypes: ["Ingress", "Egress"]
  {{- if and .Values.cveSync.service.enabled .Values.networkPolicy.monitoring.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoring.namespaceLabels | nindent 14 }}
          {{- with .Values.networkPolicy.monitoring.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.cveSync.service.port }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.localDatastores.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- range .Values.networkPolicy.externalDatastoreCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.networkPolicy.httpsEgress.enabled }}
    {{- range .Values.networkPolicy.httpsEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.cveSyncExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
