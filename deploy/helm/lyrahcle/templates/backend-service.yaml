apiVersion: v1
kind: Service
metadata:
  name: {{ include "lyrahcle.fullname" . }}-backend
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "lyrahcle.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: {{ ternary "https" "http" .Values.backend.tls.enabled }}
      port: {{ .Values.backend.service.port }}
      targetPort: api
      protocol: TCP
---
{{- if .Values.agentService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lyrahcle.fullname" . }}-agents
  labels:
    {{- include "lyrahcle.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.agentService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentService.type }}
  {{- with .Values.agentService.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.agentService.externalTrafficPolicy }}
  selector:
    {{- include "lyrahcle.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: tls
      port: {{ .Values.agentService.port }}
      targetPort: api
      protocol: TCP
{{- end }}
