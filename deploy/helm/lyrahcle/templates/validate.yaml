{{- $production := or (eq (lower .Values.application.environment) "production") (eq (lower .Values.application.environment) "prod") -}}
{{- if and $production (not .Values.backend.tls.enabled) -}}
{{ fail "production requires backend.tls.enabled=true because Lyrahcle refuses plaintext HTTP in production" }}
{{- end -}}
{{- if and $production (or (and (not .Values.backend.image.digest) (eq .Values.backend.image.tag "latest")) (and (not .Values.frontend.image.digest) (eq .Values.frontend.image.tag "latest")) (and .Values.cveSync.enabled (not .Values.cveSync.image.digest) (eq .Values.cveSync.image.tag "latest"))) -}}
{{ fail "production must pin backend/frontend/cve-sync images to a non-latest tag or digest" }}
{{- end -}}
{{- if and $production .Values.backend.tls.enabled (not .Values.frontend.backendTls.verify) -}}
{{ fail "production requires frontend.backendTls.verify=true" }}
{{- end -}}
{{- if and .Values.agentService.enabled (not .Values.backend.agentMtls.enabled) -}}
{{ fail "agentService.enabled requires backend.agentMtls.enabled=true" }}
{{- end -}}
{{- if and .Values.frontend.backendTls.verify (not .Values.frontend.backendTls.caSecretName) -}}
{{ fail "frontend.backendTls.caSecretName is required when backend TLS verification is enabled" }}
{{- end -}}
{{- if and .Values.monitoring.serviceMonitor.enabled .Values.cveSync.enabled (not .Values.cveSync.service.enabled) -}}
{{ fail "monitoring.serviceMonitor.enabled requires cveSync.service.enabled=true when cveSync is enabled" }}
{{- end -}}
{{- if and .Values.monitoring.serviceMonitor.enabled .Values.backend.tls.enabled (not .Values.monitoring.serviceMonitor.backend.tls.caSecretName) (not .Values.monitoring.serviceMonitor.backend.tls.insecureSkipVerify) -}}
{{ fail "backend TLS ServiceMonitor requires a CA secret or an explicit insecureSkipVerify override" }}
{{- end -}}
{{- if and $production (not .Values.networkPolicy.enabled) -}}
{{ fail "production requires networkPolicy.enabled=true" }}
{{- end -}}
{{- if and .Values.networkPolicy.enabled .Values.ingress.enabled (not .Values.networkPolicy.ingressController.enabled) (eq (len .Values.networkPolicy.frontendIngressCidrs) 0) -}}
{{ fail "networkPolicy requires an ingress controller selector or frontend ingress CIDR when ingress is enabled" }}
{{- end -}}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.localDatastores.enabled) (eq (len .Values.networkPolicy.externalDatastoreCidrs) 0) -}}
{{ fail "networkPolicy requires external datastore CIDRs when local datastores are disabled" }}
{{- end -}}
{{- if and .Values.networkPolicy.enabled .Values.agentService.enabled (eq (len .Values.networkPolicy.agentIngressCidrs) 0) -}}
{{ fail "networkPolicy requires agent ingress CIDRs when agentService is enabled" }}
{{- end -}}

{{- if and .Values.externalSecrets.enabled (not .Values.externalSecrets.region) -}}
{{ fail "externalSecrets.region is required when External Secrets is enabled" }}
{{- end -}}
{{- if and .Values.externalSecrets.enabled (not .Values.externalSecrets.remoteSecretKey) -}}
{{ fail "externalSecrets.remoteSecretKey is required when External Secrets is enabled" }}
{{- end -}}
{{- if and .Values.externalSecrets.enabled (ne .Values.externalSecrets.targetSecretName .Values.secrets.existingSecret) -}}
{{ fail "externalSecrets.targetSecretName must match secrets.existingSecret" }}
{{- end -}}
