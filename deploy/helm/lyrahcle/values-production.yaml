fullnameOverride: lyrahcle

application:
  host: lyrahcle.example.com
  environment: production
  webauthnRpId: lyrahcle.example.com
  webauthnOrigins: https://lyrahcle.example.com
  passwordResetBaseUrl: https://lyrahcle.example.com/
  seedAdminEmail: admin@lyrahcle.example.com
  jwtAccessTtl: 30m
  orbitalAutoEscalationEnabled: false

secrets:
  existingSecret: lyrahcle-app-secrets

backend:
  replicaCount: 2
  image:
    tag: 14.6.8
  tls:
    enabled: true
    existingSecret: lyrahcle-backend-tls
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

frontend:
  replicaCount: 2
  image:
    tag: 14.6.8
  backendTls:
    verify: true
    serverName: lyrahcle-backend
    caSecretName: lyrahcle-backend-ca
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

cveSync:
  image:
    tag: 14.6.8

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: lyrahcle-public-tls

monitoring:
  prometheusAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    backend:
      tls:
        caSecretName: lyrahcle-backend-ca
        caSecretKey: ca.crt
        serverName: lyrahcle-backend
        insecureSkipVerify: false
  prometheusRule:
    enabled: false
