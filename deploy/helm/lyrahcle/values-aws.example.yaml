fullnameOverride: lyrahcle

application:
  host: lyrahcle.example.com
  environment: production
  webauthnRpId: lyrahcle.example.com
  webauthnOrigins: https://lyrahcle.example.com
  passwordResetBaseUrl: https://lyrahcle.example.com/
  seedAdminEmail: admin@lyrahcle.example.com

secrets:
  existingSecret: lyrahcle-app-secrets

externalSecrets:
  enabled: true
  storeName: lyrahcle-aws-secrets-manager
  region: eu-west-1
  remoteSecretKey: lyrahcle-production/app
  refreshInterval: 15m
  targetSecretName: lyrahcle-app-secrets

backend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-backend
    tag: replace-with-immutable-tag
  tls:
    enabled: true
    existingSecret: lyrahcle-backend-tls
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
  topologySpread:
    enabled: true

frontend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-frontend
    tag: replace-with-immutable-tag
  backendTls:
    verify: true
    serverName: lyrahcle-backend
    caSecretName: lyrahcle-backend-ca
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
  topologySpread:
    enabled: true

cveSync:
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-cve-sync
    tag: replace-with-immutable-tag

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'replace-with-terraform-output-public-certificate-arn'
    external-dns.alpha.kubernetes.io/hostname: 'lyrahcle.example.com'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  tls:
    enabled: false

agentService:
  enabled: false
  loadBalancerClass: service.k8s.aws/nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

networkPolicy:
  enabled: true
  defaultDeny: true
  frontendIngressCidrs:
    - 10.42.0.0/16
  localDatastores:
    enabled: false
  externalDatastoreCidrs:
    - 10.42.0.0/16

monitoring:
  prometheusAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    backend:
      tls:
        caSecretName: lyrahcle-backend-ca
        caSecretKey: ca.crt
        serverName: lyrahcle-backend
        insecureSkipVerify: false
  prometheusRule:
    enabled: false
