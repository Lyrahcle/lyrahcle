fullnameOverride: lyrahcle

application:
  host: lyrahcle.example.com
  environment: production
  webauthnRpId: lyrahcle.example.com
  webauthnOrigins: https://lyrahcle.example.com
  passwordResetBaseUrl: https://lyrahcle.example.com/
  seedAdminEmail: admin@lyrahcle.example.com

secrets:
  existingSecret: lyrahcle-app-secrets

backend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-backend
    tag: 14.6.8
  tls:
    enabled: true
    existingSecret: lyrahcle-backend-tls
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
  topologySpread:
    enabled: true

frontend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-frontend
    tag: 14.6.8
  backendTls:
    verify: true
    serverName: lyrahcle-backend
    caSecretName: lyrahcle-backend-ca
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
  topologySpread:
    enabled: true

cveSync:
  image:
    repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/lyrahcle-cve-sync
    tag: 14.6.8

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  tls:
    enabled: false

agentService:
  enabled: false
  loadBalancerClass: service.k8s.aws/nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

monitoring:
  prometheusAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    backend:
      tls:
        caSecretName: lyrahcle-backend-ca
        caSecretKey: ca.crt
        serverName: lyrahcle-backend
        insecureSkipVerify: false
  prometheusRule:
    enabled: false
