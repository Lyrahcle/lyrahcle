fullnameOverride: lyrahcle

# Portable pre-production baseline. This overlay intentionally keeps ingress and
# internal TLS disabled so it can run in kind/k3d without a certificate stack.
# Production deployments must start from values-production.yaml instead.
application:
  host: lyrahcle.local
  environment: staging
  webauthnRpId: localhost
  webauthnOrigins: http://localhost:18080
  passwordResetBaseUrl: http://localhost:18080/
  seedAdminEmail: admin
  orbitalAutoEscalationEnabled: false

secrets:
  existingSecret: lyrahcle-app-secrets

backend:
  replicaCount: 2
  image:
    repository: lyrahcle/backend
    tag: dev
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

frontend:
  replicaCount: 2
  image:
    repository: lyrahcle/frontend
    tag: dev
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

cveSync:
  enabled: true
  image:
    repository: lyrahcle/cve-sync
    tag: dev
    pullPolicy: IfNotPresent

# Annotation discovery gives a small staging Prometheus a zero-CRD path. If the
# cluster uses Prometheus Operator, disable annotations and enable ServiceMonitor.
monitoring:
  prometheusAnnotations:
    enabled: true
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false

ingress:
  enabled: false

networkPolicy:
  # Leave disabled in the disposable kind environment. Enable in a real staging
  # cluster only after defining the ingress-controller/monitoring paths for its CNI.
  enabled: false
