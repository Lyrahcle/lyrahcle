fullnameOverride: lyrahcle

application:
  host: lyrahcle.local
  environment: staging
  webauthnRpId: localhost
  webauthnOrigins: http://localhost:18080
  passwordResetBaseUrl: http://localhost:18080/
  seedAdminEmail: admin
  orbitalAutoEscalationEnabled: false

secrets:
  existingSecret: lyrahcle-app-secrets

backend:
  replicaCount: 2
  image:
    repository: lyrahcle/backend
    tag: dev
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

frontend:
  replicaCount: 2
  image:
    repository: lyrahcle/frontend
    tag: dev
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

cveSync:
  enabled: true
  image:
    repository: lyrahcle/cve-sync
    tag: dev
    pullPolicy: IfNotPresent

monitoring:
  prometheusAnnotations:
    enabled: true
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false
