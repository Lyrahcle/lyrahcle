version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis:6379

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lyrahcle
      - POSTGRES_PASSWORD=lyrahcle
      - POSTGRES_DB=lyrahcle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  cve-sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cve-sync
    depends_on:
      - postgres

volumes:
  pgdata:
