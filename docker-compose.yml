services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis:6379
      - CELESTRAK_GROUPS=stations
      - JWT_SECRET=${JWT_SECRET:-insecure-dev-secret-change-me}
      # Seed admin account, created only if no users exist yet. Change the
      # password via POST /auth/change-password right after first login —
      # admin/admin is a well-known default.
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin}
      # To enable HTTPS: run scripts/generate-dev-certs.sh, then uncomment below
      # and change the port mapping to "8443:8443" with PORT=8443.
      # - TLS_CERT_FILE=/certs/dev.crt
      # - TLS_KEY_FILE=/certs/dev.key
    # volumes:
    #   - ./certs:/certs:ro

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    # To enable HTTPS: run scripts/generate-dev-certs.sh, then uncomment below
    # and add "443:443" to ports (5173:80 keeps working as an HTTP->HTTPS redirect).
    # volumes:
    #   - ./certs:/certs:ro
    #   - ./deploy/docker/nginx.frontend.tls.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lyrahcle
      - POSTGRES_PASSWORD=lyrahcle
      - POSTGRES_DB=lyrahcle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrahcle -d lyrahcle"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  cve-sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cve-sync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_ADDR=redis:6379
      - PROMETHEUS_PORT=9091
      - SYNC_INTERVAL_SEC=3600
      - NVD_RESULTS_PER_PAGE=100
      - ENVIRONMENT=development
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  sdr-agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sdr-agent
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
      - AGENT_ID=sdr-agent-dev
      - FREQUENCY_HZ=437500000
      - CAPTURE_INTERVAL_SECONDS=10
      # Recommended: create with
      #   POST /api/v1/agent-keys {"agent_id": "sdr-agent-dev"} (admin token required)
      # and paste the returned api_key here. Falls back to AGENT_TOKEN (a shared
      # operator JWT) if unset, for backward compatibility.
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      # If BACKEND_URL uses https:// with the self-signed dev cert, set this to
      # "true" for local testing ONLY. Never set it against a production backend.
      - AGENT_CA_CERT=${AGENT_CA_CERT:-}
      # Optional forensic IQ capture — off by default. See docs/forensics.md.
      #   - IQ_CAPTURE_DIR=/var/lib/lyrahcle/captures
      #   - IQ_CAPTURE_INTERVAL_SECONDS=60
      #   - IQ_CAPTURE_SAMPLES=8192
    profiles:
      - sdr

volumes:
  pgdata:
  prometheus_data:
