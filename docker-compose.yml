services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis:6379
      - CELESTRAK_GROUPS=stations
      - JWT_SECRET=${JWT_SECRET:-insecure-dev-secret-change-me}

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lyrahcle
      - POSTGRES_PASSWORD=lyrahcle
      - POSTGRES_DB=lyrahcle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  cve-sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cve-sync
    depends_on:
      - postgres

  sdr-agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sdr-agent
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - AGENT_ID=sdr-agent-dev
      - FREQUENCY_HZ=437500000
      - CAPTURE_INTERVAL_SECONDS=10
      - AGENT_TOKEN=${AGENT_TOKEN:-}
    profiles:
      - sdr

volumes:
  pgdata:
