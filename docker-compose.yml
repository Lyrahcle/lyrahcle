services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis:6379
      - CELESTRAK_GROUPS=stations
      - TLE_CORRELATION_MAX_AGE=24h
      - TLE_STALE_MAX_AGE=72h
      - ORBITAL_AUTO_ESCALATION_ENABLED=false
      - ENV=${ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:-insecure-dev-secret-change-me}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-30m}
      # Seed admin account, created only if no users exist yet. Change the
      # password via POST /auth/change-password right after first login —
      # admin/admin is a well-known default.
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-http://localhost:5173}
      - PASSWORD_RECOVERY_ENABLED=${PASSWORD_RECOVERY_ENABLED:-false}
      - PASSWORD_RESET_BASE_URL=${PASSWORD_RESET_BASE_URL:-http://localhost:5173/}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SERVER_NAME=${SMTP_SERVER_NAME:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # To enable HTTPS: run scripts/generate-dev-certs.sh, then uncomment below
      # and change the port mapping to "8443:8443" with PORT=8443.
      # - TLS_CERT_FILE=/certs/dev.crt
      # - TLS_KEY_FILE=/certs/dev.key
    # volumes:
    #   - ./certs:/certs:ro

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    # To enable HTTPS: run scripts/generate-dev-certs.sh, then uncomment below
    # and add "443:443" to ports (5173:80 keeps working as an HTTP->HTTPS redirect).
    # volumes:
    #   - ./certs:/certs:ro
    #   - ./deploy/docker/nginx.frontend.tls.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lyrahcle
      - POSTGRES_PASSWORD=lyrahcle
      - POSTGRES_DB=lyrahcle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrahcle -d lyrahcle"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  cve-sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cve-sync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_ADDR=redis:6379
      - PROMETHEUS_PORT=9091
      - SYNC_INTERVAL_SEC=3600
      - NVD_RESULTS_PER_PAGE=100
      - ENVIRONMENT=development
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      - LYRAHCLE_ENV=${ENV:-development}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-lyrahcle-dev}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$LYRAHCLE_ENV" = "production" ] || [ "$$LYRAHCLE_ENV" = "prod" ]; then
          if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "lyrahcle-dev" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "admin" ]; then
            echo "FATAL: GRAFANA_ADMIN_PASSWORD must be explicitly set to a non-default value in production" >&2
            exit 1
          fi
        fi
        exec /run.sh
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    profiles:
      - observability

  sdr-agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sdr-agent
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
      - AGENT_ID=sdr-agent-dev
      - FREQUENCY_HZ=437500000
      - CAPTURE_INTERVAL_SECONDS=10
      # Development/migration compatibility only. Production long-running agents
      # should use v9.0 enrollment + mTLS (AGENT_CERT_FILE/AGENT_KEY_FILE) and
      # optionally v9.1 signed remote configuration. Legacy keys can be created
      # with POST /api/v1/agent-keys/ (admin required). AGENT_TOKEN is an older
      # human-JWT fallback and should not be used for unattended production agents.
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - AGENT_CA_CERT=${AGENT_CA_CERT:-}
      # Optional forensic IQ capture — off by default. See docs/forensics.md.
      #   - IQ_CAPTURE_DIR=/var/lib/lyrahcle/captures
      #   - IQ_CAPTURE_INTERVAL_SECONDS=60
      #   - IQ_CAPTURE_SAMPLES=8192
    profiles:
      - sdr

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
