services:
  backend:
    image: lyrahcle/backend:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELESTRAK_GROUPS=stations
      - TLE_CORRELATION_MAX_AGE=24h
      - TLE_STALE_MAX_AGE=72h
      - ORBITAL_AUTO_ESCALATION_ENABLED=false
      - ENV=${ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:-insecure-dev-secret-change-me}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-30m}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-http://localhost:5173}
      - PASSWORD_RECOVERY_ENABLED=${PASSWORD_RECOVERY_ENABLED:-false}
      - PASSWORD_RESET_BASE_URL=${PASSWORD_RESET_BASE_URL:-http://localhost:5173/}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SERVER_NAME=${SMTP_SERVER_NAME:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}

  frontend:
    image: lyrahcle/frontend:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lyrahcle
      - POSTGRES_PASSWORD=lyrahcle
      - POSTGRES_DB=lyrahcle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrahcle -d lyrahcle"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  cve-sync:
    image: lyrahcle/cve-sync:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cve-sync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://lyrahcle:lyrahcle@postgres:5432/lyrahcle?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_PORT=9091
      - SYNC_INTERVAL_SEC=3600
      - NVD_RESULTS_PER_PAGE=100
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_MAX_PAGES=20
      - NVD_INCREMENTAL_LOOKBACK_SEC=300
      - ENVIRONMENT=development
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      - LYRAHCLE_ENV=${ENV:-development}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-lyrahcle-dev}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$LYRAHCLE_ENV" = "production" ] || [ "$$LYRAHCLE_ENV" = "prod" ]; then
          if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "lyrahcle-dev" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "admin" ]; then
            echo "FATAL: GRAFANA_ADMIN_PASSWORD must be explicitly set to a non-default value in production" >&2
            exit 1
          fi
        fi
        exec /run.sh
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    profiles:
      - observability

  sdr-agent:
    image: lyrahcle/sdr-agent:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sdr-agent
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
      - AGENT_ID=sdr-agent-dev
      - FREQUENCY_HZ=437500000
      - CAPTURE_INTERVAL_SECONDS=10
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - AGENT_CA_CERT=${AGENT_CA_CERT:-}
    profiles:
      - sdr

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
