name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrahcle
          POSTGRES_PASSWORD: lyrahcle
          POSTGRES_DB: lyrahcle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - name: Build
        run: go build ./...
      - name: Unit tests
        env:
          TEST_REDIS_ADDR: localhost:6379
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://lyrahcle:lyrahcle@localhost:5432/lyrahcle_test?sslmode=disable
        run: |
          go test ./internal/store/... -v
          go test ./cmd/server/... -v
      - name: Vet
        run: go vet ./...
      - name: Static security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -severity high -confidence high -exclude=G505 ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  other-go-modules:
    name: Build & vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cve-sync, sdr-agent]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Critical SDR coverage gate
        if: matrix.module == 'sdr-agent'
        run: |
          go test ./internal/forensics ./internal/replay ./internal/streaming ./internal/uplink -coverprofile=coverage-critical.out
          ../../scripts/check-go-coverage.sh coverage-critical.out 80
      - name: SDR fuzzing
        if: matrix.module == 'sdr-agent'
        run: |
          go test ./internal/forensics -run=^$ -fuzz=FuzzCaptureRoundTrip -fuzztime=10s
          go test ./internal/replay -run=^$ -fuzz=FuzzPowerWindows -fuzztime=10s
      - name: Vet
        run: go vet ./...
      - name: Static security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -severity high -confidence high -exclude=G505 ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose, scripts and observability configuration
        run: |
          docker compose --profile observability config -q
          bash -n scripts/*.sh
          python3 -m json.tool deploy/grafana/dashboards/lyrahcle-overview.json >/dev/null
      - name: Command-injection contract
        run: |
          python3 -m unittest scripts/test_check_command_execution.py
          python3 scripts/check-command-execution.py .
      - name: Script executable permission contract
        run: |
          python3 -m unittest scripts/test_check_script_permissions.py
          python3 scripts/check-script-permissions.py .
      - name: Go toolchain contract
        run: |
          python3 -m unittest scripts/test_check_go_toolchain.py
          python3 scripts/check-go-toolchain.py .
      - name: SQL construction contract
        run: |
          python3 -m unittest scripts/test_check_sql_construction.py
          python3 scripts/check-sql-construction.py .
      - name: Frontend XSS contract
        run: |
          python3 -m unittest scripts/test_check_frontend_xss.py
          python3 scripts/check-frontend-xss.py .
      - name: Asset and program UI parity contract
        run: |
          python3 -m unittest scripts/test_check_asset_program_parity.py
          python3 scripts/check-asset-program-parity.py .
      - name: Platform organization UI parity contract
        run: |
          python3 -m unittest scripts/test_check_platform_organization_parity.py
          python3 scripts/check-platform-organization-parity.py .
      - name: Satellite UI parity contract
        run: |
          python3 -m unittest scripts/test_check_satellite_ui_parity.py
          python3 scripts/check-satellite-ui-parity.py .

      - name: Correlation UI parity contract
        run: |
          python3 -m unittest scripts/test_check_correlation_ui_parity.py
          python3 scripts/check-correlation-ui-parity.py .
      - name: HTTP error UI contract
        run: |
          python3 -m unittest scripts/test_check_http_error_ui.py
          python3 scripts/check-http-error-ui.py .
      - name: KeyProvider and KID contract
        run: |
          python3 -m unittest scripts/test_check_keyprovider_kid.py scripts/test_check_signing_key_lifecycle.py scripts/test_check_signing_key_automation.py scripts/test_check_tenant_rate_limiting.py scripts/test_check_background_job_idempotency.py scripts/test_check_agent_hardware_ui.py
          python3 scripts/check-keyprovider-kid.py .
          python3 scripts/check-signing-key-lifecycle.py .
          python3 scripts/check-signing-key-automation.py .
          python3 scripts/check-tenant-rate-limiting.py .
          python3 scripts/check-background-job-idempotency.py .
          python3 scripts/check-agent-hardware-ui.py .
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: deploy/docker/Dockerfile.backend

  smoke-test:
    name: Full-stack smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate CycloneDX SBOMs
        run: ./scripts/generate-sbom.sh
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sboms
          path: artifacts/sbom/
          if-no-files-found: error

