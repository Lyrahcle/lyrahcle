name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrahcle
          POSTGRES_PASSWORD: lyrahcle
          POSTGRES_DB: lyrahcle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - name: Build
        run: go build ./...
      - name: Unit tests
        env:
          TEST_REDIS_ADDR: localhost:6379
        run: go test ./...
      - name: Critical backend security coverage gate
        env:
          TEST_REDIS_ADDR: localhost:6379
        run: |
          go test ./internal/auth ./internal/correlation ./internal/detection ./internal/tlequality -coverprofile=coverage-security-critical.out
          ../../scripts/check-go-coverage.sh coverage-security-critical.out 80
      - name: Race detector
        run: go test -race ./...
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://lyrahcle:lyrahcle@localhost:5432/lyrahcle_test?sslmode=disable
        run: |
          go test ./internal/store/... -v
          go test ./cmd/server/... -v
      - name: Vet
        run: go vet ./...
      - name: Static security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -severity high -confidence high -exclude=G505 ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  other-go-modules:
    name: Build & vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cve-sync, sdr-agent]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Critical SDR coverage gate
        if: matrix.module == 'sdr-agent'
        run: |
          go test ./internal/forensics ./internal/replay ./internal/streaming ./internal/uplink -coverprofile=coverage-critical.out
          ../../scripts/check-go-coverage.sh coverage-critical.out 80
      - name: Critical RF acquisition and DSP coverage gate
        if: matrix.module == 'sdr-agent'
        run: |
          go test ./internal/dsp ./internal/capture ./internal/soapy -coverprofile=coverage-rf.out
          ../../scripts/check-go-coverage.sh coverage-rf.out 80
      - name: SDR fuzzing
        if: matrix.module == 'sdr-agent'
        run: |
          go test ./internal/forensics -run=^$ -fuzz=FuzzCaptureRoundTrip -fuzztime=10s
          go test ./internal/replay -run=^$ -fuzz=FuzzPowerWindows -fuzztime=10s
          go test ./internal/dsp -run=^$ -fuzz=FuzzEstimateCarrier -fuzztime=15s
      - name: Vet
        run: go vet ./...
      - name: Static security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -severity high -confidence high -exclude=G505 ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4
      - name: Validate compose, scripts and observability configuration
        run: |
          docker compose --profile observability config -q
          bash -n scripts/*.sh
          python3 -m json.tool deploy/grafana/dashboards/lyrahcle-overview.json >/dev/null
      - name: Security and parity contracts
        run: ./scripts/check-contracts.sh
      - name: DR evidence contract tests
        run: python3 -m unittest scripts/test_collect_dr_evidence.py
      - name: Helm lint and render
        run: |
          helm lint deploy/helm/lyrahcle
          helm lint deploy/helm/lyrahcle -f deploy/helm/lyrahcle/values-staging.yaml
          helm lint deploy/helm/lyrahcle -f deploy/helm/lyrahcle/values-production.yaml
          helm template lyrahcle deploy/helm/lyrahcle -f deploy/helm/lyrahcle/values-staging.yaml >/dev/null
          helm template lyrahcle deploy/helm/lyrahcle -f deploy/helm/lyrahcle/values-production.yaml \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.prometheusRule.enabled=true >/dev/null
          helm template lyrahcle deploy/helm/lyrahcle -f deploy/helm/lyrahcle/values-aws.example.yaml >/dev/null
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: deploy/docker/Dockerfile.backend

  smoke-test:
    name: Full-stack smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate CycloneDX SBOMs
        run: ./scripts/generate-sbom.sh
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sboms
          path: artifacts/sbom/
          if-no-files-found: error

