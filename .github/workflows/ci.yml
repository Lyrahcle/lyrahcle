name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrahcle
          POSTGRES_PASSWORD: lyrahcle
          POSTGRES_DB: lyrahcle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://lyrahcle:lyrahcle@localhost:5432/lyrahcle_test?sslmode=disable
        run: |
          go test ./internal/store/... -v
          go test ./cmd/server/... -v
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  other-go-modules:
    name: Build & vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cve-sync, sdr-agent]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: deploy/docker/Dockerfile.backend

  smoke-test:
    name: Full-stack smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
