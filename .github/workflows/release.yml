name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: deploy/docker/Dockerfile.backend
          - image: frontend
            dockerfile: deploy/docker/Dockerfile.frontend
          - image: cve-sync
            dockerfile: deploy/docker/Dockerfile.cve-sync
          - image: sdr-agent
            dockerfile: deploy/docker/Dockerfile.sdr-agent
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lyrahcle-${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/lyrahcle-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lyrahcle-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lyrahcle-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lyrahcle-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Generate release SBOMs
        run: ./scripts/generate-sbom.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/sbom/*.cdx.json
            artifacts/sbom/SHA256SUMS
          body: |
            Images published to GHCR for this release:

            - `ghcr.io/${{ github.repository_owner }}/lyrahcle-backend:${{ steps.version.outputs.value }}`
            - `ghcr.io/${{ github.repository_owner }}/lyrahcle-frontend:${{ steps.version.outputs.value }}`
            - `ghcr.io/${{ github.repository_owner }}/lyrahcle-cve-sync:${{ steps.version.outputs.value }}`
            - `ghcr.io/${{ github.repository_owner }}/lyrahcle-sdr-agent:${{ steps.version.outputs.value }}`

            See [CHANGELOG.md](./CHANGELOG.md) for what changed.
